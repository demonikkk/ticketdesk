
{% extends "base.html" %}

{% block content %}

<style>
    .login-wrapper {
        min-height: 80vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px 15px;
        background: #f8fafc;
    }

    .login-card {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid #e8edf5;
        box-shadow: 0 15px 45px rgba(15, 23, 42, 0.08);
    }

    .login-logo {
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #4338ca, #818cf8);
        color: white;
        font-size: 27px;
        font-weight: 800;
        box-shadow: 0 6px 15px rgba(99, 102, 241, 0.25);
    }

    .login-heading {
        text-align: center;
        margin-bottom: 30px;
    }

    .login-heading h2 {
        font-size: 27px;
        font-weight: 750;
        color: #0f172a;
        margin: 0 0 9px;
    }

    .login-heading p {
        font-size: 14px;
        color: #64748b;
        margin: 0;
    }

    .login-form {
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 13px;
        font-weight: 650;
        color: #334155;
    }

    .input-wrapper {
        position: relative;
    }

    .input-wrapper input {
        width: 100%;
        padding: 14px 15px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background: #f8fafc;
        color: #1e293b;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
    }

    .input-wrapper input:focus {
        border-color: #6366f1;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .input-wrapper input::placeholder {
        color: #94a3b8;
    }

    .password-input {
        padding-right: 65px !important;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #6366f1;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
    }

    .login-button {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #4338ca, #6366f1);
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.25s;
        box-shadow: 0 5px 12px rgba(99, 102, 241, 0.2);
    }

    .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(99, 102, 241, 0.3);
    }

    .login-button:active {
        transform: translateY(0);
    }

    .login-error {
        padding: 12px 14px;
        margin-bottom: 20px;
        border-radius: 9px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        font-size: 13px;
    }

    .register-link {
        text-align: center;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
        color: #64748b;
        font-size: 14px;
    }

    .register-link a {
        color: #4f46e5;
        font-weight: 700;
        text-decoration: none;
        margin-left: 4px;
    }

    .register-link a:hover {
        color: #3730a3;
        text-decoration: underline;
    }

    .login-footer {
        text-align: center;
        margin-top: 25px;
        color: #94a3b8;
        font-size: 12px;
    }

    @media (max-width: 480px) {
        .login-card {
            padding: 28px 22px;
        }

        .login-heading h2 {
            font-size: 23px;
        }
    }
</style>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Logo -->
        <div class="login-logo">
            T
        </div>

        <!-- Heading -->
        <div class="login-heading">
            <h2>Welcome Back!</h2>
            <p>Sign in to access your Ticket Management System.</p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="login-error">
            ⚠ {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="post" class="login-form">

            <div class="form-group">
                <label for="username">Username</label>

                <div class="input-wrapper">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="password-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword()"
                        id="toggleBtn"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button type="submit" class="login-button">
                Sign In →
            </button>

        </form>

        <!-- Register Link -->
        <div class="register-link">
            Don't have an account?
            <a href="/register">Create Account</a>
        </div>

        <div class="login-footer">
            Secure Login · Ticket Management System
        </div>

    </div>

</div>

<script>
    function togglePassword() {
        const password = document.getElementById("password");
        const button = document.getElementById("toggleBtn");

        if (password.type === "password") {
            password.type = "text";
            button.textContent = "Hide";
        } else {
            password.type = "password";
            button.textContent = "Show";
        }
    }
</script>

{% endblock %}
