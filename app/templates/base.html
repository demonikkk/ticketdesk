<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketDesk</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:960px;margin:0 auto;padding:1rem}
 nav{display:flex;gap:1rem;align-items:center;border-bottom:1px solid #ddd;padding-bottom:.5rem;margin-bottom:1rem}
 nav .spacer{flex:1}
 table{width:100%;border-collapse:collapse}
 th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}
 input,select,textarea{padding:6px;margin:4px 0;width:100%;box-sizing:border-box}
 button{padding:6px 14px;cursor:pointer}
 .inline{width:auto}
 .badge{padding:2px 8px;border-radius:10px;background:#e8eaff;font-size:.85em}
 .error{color:#b00020}
 .cards{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
 .card{border:1px solid #ddd;border-radius:8px;padding:1rem;min-width:140px}
 .card b{font-size:1.8rem;display:block}
</style></head>
<body>
<nav>
 <a href="/tickets"><strong>TicketDesk</strong></a>
 {% if user %}
  <a href="/tickets">Tickets</a><a href="/tickets/new">New ticket</a><a href="/dashboard">Dashboard</a>
  <span class="spacer"></span><span>{{ user.username }}</span><a href="/logout">Logout</a>
 {% endif %}
</nav>
{% block content %}{% endblock %}
</body></html>
