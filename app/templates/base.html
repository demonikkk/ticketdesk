<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TicketDesk</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem;
            background: #f5f6fc;
            color: #1f2937;
        }

        nav {
            display: flex;
            gap: 1.3rem;
            align-items: center;
            background: #ffffff;
            padding: 16px 22px;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
            border: 1px solid #eeeeff;
        }

        nav a {
            color: #4b5563;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #4f46e5;
        }

        nav a strong {
            font-size: 21px;
            color: #4f46e5;
            font-weight: 750;
        }

        nav .spacer {
            flex: 1;
        }

        nav span:not(.spacer) {
            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            border-bottom: 1px solid #eee;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #4f46e5;
            color: #ffffff;
            font-weight: 600;
        }

        input, select, textarea {
            padding: 10px 12px;
            margin: 6px 0 12px;
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        button {
            padding: 9px 18px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #3730a3;
        }

        .inline {
            width: auto;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: #e8eaff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 600;
        }

        .error {
            color: #b00020;
            background: #fff1f2;
            padding: 10px 14px;
            border-radius: 7px;
            border: 1px solid #fecdd3;
        }

        .cards {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 1.2rem;
            min-width: 140px;
            background: #ffffff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
        }

        .card b {
            font-size: 1.8rem;
            display: block;
            color: #4f46e5;
        }

        @media (max-width: 650px) {
            body {
                padding: 0.8rem;
            }

            nav {
                gap: 0.8rem;
                flex-wrap: wrap;
                padding: 14px;
            }

            nav .spacer {
                display: none;
            }

            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>

<nav>
    <a href="/tickets"><strong>TicketDesk</strong></a>

    {% if user %}
        <a href="/tickets">Tickets</a>
        <a href="/tickets/new">New ticket</a>
        <a href="/dashboard">Dashboard</a>

        <span class="spacer"></span>

        <span>{{ user.username }}</span>
        <a href="/logout">Logout</a>
    {% endif %}
</nav>

{% block content %}{% endblock %}

</body>
</html>
